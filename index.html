const labels={en:{title:"Bushra | Digital Market Intelligence",sub:"Executive command center · Social performance + 10-market intelligence",notice:"PROTOTYPE — No social accounts connected. Account KPIs are shown only after CSV import. Historical market percentages carried over from the prior demo are unverified and must not be used for executive decisions.",tabs:["Executive Overview","Bushra Channels","Market Intelligence","Campaigns","Data & Governance"],upload:"Import account CSV",markets:"Target markets",channels:"Official channels",connected:"Live connections",records:"Imported records",perf:"Bushra account performance",perfNote:"Use verified exports from official social platforms. The demo processes CSV in your browser only.",trend:"Executive monitoring priorities",status:"Data readiness",selected:"Selected market",popularity:"Platform usage (legacy reference only)",rankingNote:"Unverified percentages inherited from the earlier prototype; they may use incomparable methods. Not approved as current country-wide statistics.",missing:"No verified comparable platform data",lang:"Primary language",priority:"Suggested editorial focus",source:"Source / survey year / metric must be verified before publishing",data:"Import account metrics",template:"Download CSV template",csvNote:"Required columns: platform,country,date,followers,reach,impressions,engagements,posts,spend,clicks. Numeric values must be nonnegative. Rows are held only in this browser tab and are not uploaded.",table:"Imported account records",empty:"No account records imported yet",decision:"Executive interpretation",caution:"Do not confuse national platform usage with Bushra account performance.",campaign:"Campaign overview",campaignNote:"Campaign spend and clicks from imported records; ROI requires reliable conversion and revenue attribution.",govern:"Governance & integration roadmap",r1:"Phase 1 · Controlled reporting",r2:"Phase 2 · Official read-only APIs",r3:"Phase 3 · Secure executive production",r1d:"Upload approved platform exports, validate sources, and standardize KPIs.",r2d:"Use server-side OAuth, least-privilege permissions and secure token storage.",r3d:"Private repository, Cloudflare Access, server-side database, audit trail and refresh monitoring.",rows:"records",all:"All markets",verified:"Imported CSV",nodata:"Awaiting verified data",posts:"Posts",reach:"Reach",engagements:"Engagements",spend:"Spend",clicks:"Clicks",followers:"Followers",imported:"Imported successfully",invalid:"CSV rejected: check headers, platform names, countries and nonnegative numbers.",examples:"Current dashboard data"},ar:{title:"بشرى | ذكاء الأسواق الرقمية",sub:"مركز القيادة التنفيذي · أداء حسابات بشرى وذكاء 10 أسواق",notice:"نسخة تجريبية — لا توجد حسابات متصلة. مؤشرات حسابات بشرى تظهر بعد استيراد CSV فقط. نسب استخدام المنصات الموروثة من النسخة السابقة غير متحقق منها ولا تصلح لقرارات الإدارة.",tabs:["الملخص التنفيذي","حسابات بشرى","ذكاء الأسواق","الحملات","البيانات والحوكمة"],upload:"استيراد بيانات CSV",markets:"الأسواق المستهدفة",channels:"الحسابات الرسمية",connected:"الاتصالات المباشرة",records:"السجلات المستوردة",perf:"أداء حسابات بشرى",perfNote:"استخدم تقارير موثقة من المنصات الرسمية. تتم معالجة CSV داخل المتصفح فقط.",trend:"أولويات المتابعة التنفيذية",status:"جاهزية البيانات",selected:"السوق المختار",popularity:"استخدام المنصات (مرجع سابق فقط)",rankingNote:"نسب غير متحقق منها موروثة من النموذج السابق وقد تعتمد على منهجيات غير متجانسة؛ لا تُعتمد كإحصاءات وطنية حالية.",missing:"لا توجد بيانات مقارنة موثقة",lang:"اللغة الرئيسية",priority:"محاور المحتوى المقترحة",source:"يجب التحقق من المصدر وسنة الدراسة والمقياس قبل النشر",data:"استيراد مؤشرات الحسابات",template:"تنزيل نموذج CSV",csvNote:"الأعمدة المطلوبة: platform,country,date,followers,reach,impressions,engagements,posts,spend,clicks. القيم الرقمية غير سالبة. تبقى البيانات في صفحة المتصفح ولا تُرفع لخادم.",table:"سجلات الحسابات المستوردة",empty:"لم تُستورد بيانات حسابات بعد",decision:"قراءة تنفيذية",caution:"يجب عدم الخلط بين استخدام المنصات على مستوى الدولة وأداء حسابات بشرى.",campaign:"ملخص الحملات",campaignNote:"الإنفاق والنقرات من البيانات المستوردة؛ قياس العائد يتطلب ربط التحويلات والإيرادات بمصدر موثوق.",govern:"الحوكمة وخارطة التكامل",r1:"المرحلة 1 · تقارير مضبوطة",r2:"المرحلة 2 · واجهات رسمية للقراءة فقط",r3:"المرحلة 3 · تشغيل تنفيذي آمن",r1d:"استيراد تقارير معتمدة وتوثيق مصادرها وتوحيد المؤشرات.",r2d:"استخدام OAuth عبر الخادم وصلاحيات محدودة وتخزين آمن للرموز.",r3d:"مستودع خاص وحماية Cloudflare Access وقاعدة بيانات وسجل تدقيق.",rows:"سجل",all:"جميع الأسواق",verified:"ملف CSV مستورد",nodata:"بانتظار بيانات موثقة",posts:"المنشورات",reach:"الوصول",engagements:"التفاعلات",spend:"الإنفاق",clicks:"النقرات",followers:"المتابعون",imported:"تم الاستيراد بنجاح",invalid:"رفض الملف: تحقق من الأعمدة وأسماء المنصات والدول والأرقام غير السالبة.",examples:"بيانات اللوحة الحالية"}};
let lang="en",tab=0,market=0,filter="All",records=[],mode=null;
const t=k=>labels[lang][k],cn=i=>countries[i][0]+" "+countries[i][lang==="ar"?2:1],n=x=>Number(x||0).toLocaleString(lang==="ar"?"ar-SA":"en-US");
function toggleLang(){lang=lang==="en"?"ar":"en";render()}
function enterMode(m){mode=m;tab=0;document.getElementById("landing").hidden=true;document.getElementById("appShell").hidden=false;render();window.scrollTo(0,0)}
function goHome(){mode=null;document.getElementById("landing").hidden=false;document.getElementById("appShell").hidden=true;render();window.scrollTo(0,0)}
function setTab(i){tab=i;render()}function setMarket(i){market=i;render()}function setFilter(x){filter=x;render()}
function card(label,value,detail){return `<div class="card kpi"><div class="muted">${label}</div><strong>${value}</strong><small>${detail}</small></div>`}
function filtered(){return records.filter(r=>filter==="All"||r.country===filter)}
function totals(rs){return ["followers","reach","impressions","engagements","posts","spend","clicks"].reduce((a,k)=>(a[k]=rs.reduce((s,r)=>s+r[k],0),a),{})}
function platformTable(rs){return `<div class="tablewrap"><table><thead><tr><th>Platform</th><th>${t("followers")}</th><th>${t("reach")}</th><th>${t("engagements")}</th><th>${t("posts")}</th></tr></thead><tbody>${channels.map(p=>{let a=totals(rs.filter(r=>r.platform===p));return `<tr><td><b>${p}</b></td><td>${n(a.followers)}</td><td>${n(a.reach)}</td><td>${n(a.engagements)}</td><td>${n(a.posts)}</td></tr>`}).join("")}</tbody></table></div><p class="legend">${t("caution")} · Follower totals across dates are not deduplicated; use the latest snapshot per platform for reporting.</p>`}
function overview(){let a=totals(records);return `<div class="heading"><div><h2>${t("tabs")[0]}</h2><div class="muted">${t("perfNote")}</div></div><span class="pill">${t("nodata")}</span></div><div class="grid">${card(t("markets"),"10",t("examples"))}${card(t("channels"),"7",t("examples"))}${card(t("connected"),"0","API / OAuth")}${card(t("records"),n(records.length),t("verified"))}</div><div class="two"><div class="card"><h3>${t("perf")}</h3>${records.length?`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${card(t("reach"),n(a.reach),"CSV")}${card(t("engagements"),n(a.engagements),"CSV")}${card(t("posts"),n(a.posts),"CSV")}${card(t("spend"),n(a.spend),"CSV")}</div>`:`<div class="empty">${t("empty")}</div>`}</div><div class="card"><h3>${t("trend")}</h3><div class="row"><span>01 · ${t("channels")}</span><span class="pill">${records.length?t("verified"):t("nodata")}</span></div><div class="row"><span>02 · ${t("markets")}</span><span class="pill gold">${t("source")}</span></div><div class="row"><span>03 · ROI / conversion attribution</span><span class="pill">${t("nodata")}</span></div><div class="note" style="margin-top:16px">${t("caution")}</div></div></div>`}
function accounts(){let rs=filtered(),a=totals(rs);return `<div class="heading"><div><h2>${t("tabs")[1]}</h2><div class="muted">${t("perfNote")}</div></div><select onchange="setFilter(this.value)"><option value="All">${t("all")}</option>${countries.map(c=>`<option value="${c[1]}" ${filter===c[1]?"selected":""}>${c[lang==="ar"?2:1]}</option>`).join("")}</select></div><div class="grid">${card(t("reach"),records.length?n(a.reach):"—","CSV")}${card(t("engagements"),records.length?n(a.engagements):"—","CSV")}${card(t("posts"),records.length?n(a.posts):"—","CSV")}${card(t("spend"),records.length?n(a.spend):"—","CSV")}</div><div class="card" style="margin-top:16px"><h3>${t("channels")}</h3><div class="platforms">${channels.map(p=>`<div class="platform"><b>${p}</b><small>${rs.some(r=>r.platform===p)?t("verified"):t("nodata")}</small></div>`).join("")}</div></div><div class="card" style="margin-top:16px"><h3>${t("perf")}</h3>${records.length?platformTable(rs):`<div class="empty">${t("empty")}</div>`}</div>`}
function markets(){let c=countries[market],v=usage[c[1]];return `<div class="heading"><div><h2>${t("tabs")[2]}</h2><div class="muted">${t("caution")}</div></div></div><div class="card"><div class="market-grid">${countries.map((c,i)=>`<button class="market ${i===market?"selected":""}" onclick="setMarket(${i})"><span>${c[0]}</span>${c[lang==="ar"?2:1]}</button>`).join("")}</div></div><div class="two"><div class="card"><h3>${t("selected")}: ${cn(market)}</h3><div class="row"><span>${t("lang")}</span><b>${c[3]}</b></div><div class="row"><span>${t("priority")}</span><b>Hajj · Umrah · Hospitality</b></div><div class="row"><span>${t("status")}</span><span class="pill gold">${t("source")}</span></div><div class="note" style="margin-top:15px">${t("caution")}</div></div><div class="card"><h3>${t("popularity")}</h3><p class="muted">${t("rankingNote")}</p>${v?v.map(([p,val])=>`<div class="barrow"><b>${p}</b><div class="track"><div class="fill" style="width:${val}%"></div></div><b>${val}%</b></div>`).join(""):`<div class="empty">${t("missing")}</div>`}<p class="source">${t("source")}</p></div></div>`}
function campaigns(){let a=totals(records);return `<div class="heading"><div><h2>${t("campaign")}</h2><div class="muted">${t("campaignNote")}</div></div></div><div class="grid">${card(t("spend"),records.length?n(a.spend):"—","CSV")}${card(t("clicks"),records.length?n(a.clicks):"—","CSV")}${card("Conversions","—",t("nodata"))}${card("ROAS","—",t("nodata"))}</div><div class="card" style="margin-top:16px"><h3>${t("decision")}</h3><div class="empty">${t("campaignNote")}</div></div>`}
function data(){return `<div class="heading"><div><h2>${t("govern")}</h2><div class="muted">${t("csvNote")}</div></div><button class="btn" onclick="downloadTemplate()">${t("template")}</button></div><div class="three">${[1,2,3].map(i=>`<div class="card"><h3>${t("r"+i)}</h3><p class="muted">${t("r"+i+"d")}</p></div>`).join("")}</div><div class="card" style="margin-top:16px"><h3>${t("table")} · ${n(records.length)} ${t("rows")}</h3>${records.length?`<div class="tablewrap"><table><thead><tr>${["platform","country","date","followers","reach","impressions","engagements","posts","spend","clicks"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${records.slice(0,100).map(r=>`<tr>${["platform","country","date","followers","reach","impressions","engagements","posts","spend","clicks"].map(x=>`<td>${escapeHTML(String(r[x]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="empty">${t("empty")}</div>`}<p class="legend">${t("csvNote")}</p></div>`}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function downloadTemplate(){let s="platform,country,date,followers,reach,impressions,engagements,posts,spend,clicks\n";let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="bushra_account_metrics_template.csv";a.click();URL.revokeObjectURL(a.href)}
function parseCSV(s){let rows=[],row=[],cell="",quoted=false;for(let i=0;i<s.length;i++){let ch=s[i];if(ch==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=""}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=ch}if(quoted)throw Error("quote");row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSV(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let rows=parseCSV(reader.result),headers=rows.shift().map(x=>x.trim().toLowerCase().replace(/^\ufeff/,""));let required=["platform","country","date","followers","reach","impressions","engagements","posts","spend","clicks"];if(!required.every(x=>headers.includes(x)))throw Error("headers");let next=rows.map(row=>{if(row.length!==headers.length)throw Error("columns");let o={};headers.forEach((h,i)=>o[h]=row[i].trim());if(!channels.includes(o.platform)||!countries.some(c=>c[1]===o.country)||!/^\d{4}-\d{2}-\d{2}$/.test(o.date)||Number.isNaN(Date.parse(o.date)))throw Error("values");for(let k of required.slice(3)){if(o[k]===""||!Number.isFinite(Number(o[k]))||Number(o[k])<0)throw Error("numeric");o[k]=Number(o[k])}return o});if(!next.length)throw Error("empty");records=next;tab=1;render();alert(t("imported")+" · "+next.length+" "+t("rows"))}catch(err){alert(t("invalid"))}e.target.value=""};reader.readAsText(f)}
